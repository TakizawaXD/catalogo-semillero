spring.application.name=catalogo
spring.profiles.default=dev

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
logging.level.root=INFO

app.jwt.expiracion-ms=900000
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never

info.app.name=Catalogo Semillero
info.app.description=API REST para el catálogo de productos de Semillero
server.port=${PORT:8080}