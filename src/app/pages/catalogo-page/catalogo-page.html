<main class="catalogo">
  <header class="catalogo__header">
    <div>
      <p>Catálogo de productos</p>
      <h1>Productos</h1>
    </div>

    <button type="button" (click)="cambiarRol()">
      Cambiar a vista
      {{ rol() === 'admin' ? 'cliente' : 'administrador' }}
    </button>
  </header>

  <section class="carrito">
    <strong>
      Ítems en el carrito: {{ carritoService.cantidad() }}
    </strong>

    <span>
      Total: {{ carritoService.total() | currency }}
    </span>
  </section>

  <section class="filtros">
    <label for="categoria">Filtrar por categoría:</label>

    <select id="categoria" (change)="cambiarCategoria($event)">
      <option value="todas">Todas</option>

      <option
        *ngFor="
          let categoria of categorias$ | async;
          trackBy: trackByCategoria
        "
        [value]="categoria.id"
      >
        {{ categoria.name }}
      </option>
    </select>
  </section>

  <p class="estado-carga" *ngIf="cargando()">
    Cargando productos...
  </p>

  <p class="estado-error" *ngIf="errorCatalogo()">
    {{ errorCatalogo() }}
  </p>

  <ng-container *ngIf="productos$ | async as productos">
    <p
      class="estado-vacio"
      *ngIf="!cargando() && productos.length === 0 && !errorCatalogo()"
    >
      No hay productos para esta categoría.
    </p>

    <ng-container *ngIf="productos.length > 0">
      <ng-container [ngSwitch]="rol()">
        <app-tabla-productos
          *ngSwitchCase="'admin'"
          [productos]="productos"
          (editar)="editarProducto($event)"
          (eliminar)="eliminarProducto($event)"
        />

        <section
          *ngSwitchCase="'customer'"
          class="productos-grid"
        >
          <app-targeta-producto
            *ngFor="
              let producto of productos;
              trackBy: trackById
            "
            [producto]="producto"
            (agregarAlCarrito)="agregarAlCarrito($event)"
          />
        </section>
      </ng-container>
    </ng-container>
  </ng-container>
</main>
