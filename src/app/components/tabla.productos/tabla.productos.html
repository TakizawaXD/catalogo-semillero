<p *ngIf="productos.length === 0">
  No hay productos para mostrar.
</p>

<table *ngIf="productos.length > 0">
  <thead>
    <tr>
      <th>ID</th>
      <th>Miniatura</th>
      <th>Título</th>
      <th>Categoría</th>
      <th>Precio</th>
      <th>Acciones</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let producto of productos; trackBy: trackById">
      <td>{{ producto.id }}</td>

      <td>
        <img
          [src]="producto.image[0]"
          [alt]="producto.title"
        />
      </td>

      <td>{{ producto.title }}</td>
      <td>{{ producto.category.name }}</td>
      <td>{{ producto.price | currency }}</td>

      <td>
        <button
          type="button"
          (click)="editar.emit(producto)"
        >
          Editar
        </button>

        <button
          type="button"
          (click)="eliminar.emit(producto)"
        >
          Eliminar
        </button>
      </td>
    </tr>
  </tbody>
</table>
